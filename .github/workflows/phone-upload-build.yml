name: Build native BadGenesis from phone upload

on:
  workflow_dispatch:
  push:
    paths:
      - 'BadGenesis-source.zip'
      - '.github/workflows/phone-native-build.yml'
      - '.github/workflows/phone-upload-build.yml'

permissions:
  contents: read

concurrency:
  group: badgenesis-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BG_PROJECT: badgenesis-native-build/BadGenesis
    steps:
      - uses: actions/checkout@v4

      - name: Extract the preserved project and native core
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path('BadGenesis-source.zip')
          if not archive.is_file():
              raise SystemExit('Upload BadGenesis-source.zip at the repository root.')
          destination = pathlib.Path('badgenesis-native-build').resolve()
          destination.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  target = (destination / entry.filename).resolve()
                  parts = pathlib.PurePosixPath(entry.filename).parts
                  if not target.is_relative_to(destination) or not parts or parts[0] != 'BadGenesis':
                      raise SystemExit('Unsafe or unexpected source archive path.')
              source.extractall(destination)
          project = destination / 'BadGenesis'
          required = ('tools/native-runtime-build.sh', 'tools/test-native.sh',
                      'app/src/main/cpp/native_backend.cpp', 'app/src/main/cpp/rtc_engine.cpp',
                      'app/src/main/java/com/badgenesis/app/NativeBridge.java',
                      'vendor/genesis-plus-gx/libretro/libretro.c')
          for name in required:
              if not (project / name).is_file():
                  raise SystemExit('Native project is missing ' + name)
          (project / 'dist').mkdir(exist_ok=True)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Retain the app signing key for updates
        uses: actions/cache@v4
        with:
          path: ${{ env.BG_PROJECT }}/signing/badgenesis-development.keystore
          key: badgenesis-development-signing-v1-${{ github.repository_id }}

      - name: Cache verified Android SDK and NDK downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.BG_PROJECT }}/toolchain
          key: badgenesis-native-linux-api36-ndk28-v2

      - name: Validate native emulation before live RTC and rewind
        run: |
          set -o pipefail
          bash "$BG_PROJECT/tools/test-native.sh" 2>&1 | tee "$BG_PROJECT/dist/native-validation.log"

      - name: Compile, link, sign and verify the native Android APK
        run: |
          set -o pipefail
          bash "$BG_PROJECT/tools/cloud-build.sh" 2>&1 | tee "$BG_PROJECT/dist/native-cloud-build.log"
          sha256sum "$BG_PROJECT/dist/BadGenesis-Native-Android16.apk" > "$BG_PROJECT/dist/BadGenesis-Native-Android16.apk.sha256"

      - name: Downloadable native APK
        uses: actions/upload-artifact@v4
        with:
          name: BadGenesis-Native-Android16
          path: |
            ${{ env.BG_PROJECT }}/dist/BadGenesis-Native-Android16.apk
            ${{ env.BG_PROJECT }}/dist/BadGenesis-Native-Android16.apk.sha256
            ${{ env.BG_PROJECT }}/dist/apk-badging.txt
            ${{ env.BG_PROJECT }}/dist/apk-native-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Keep native build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BadGenesis-Native-diagnostics
          path: |
            ${{ env.BG_PROJECT }}/dist/native-cloud-build.log
            ${{ env.BG_PROJECT }}/dist/native-validation.log
            ${{ env.BG_PROJECT }}/test-results/native-*.json
            ${{ env.BG_PROJECT }}/test-results/native-*.jsonl
            ${{ env.BG_PROJECT }}/test-results/native-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Source and notices accompanying the native build
        uses: actions/upload-artifact@v4
        with:
          name: BadGenesis-Native-source
          path: |
            BadGenesis-source.zip
            ${{ env.BG_PROJECT }}/vendor/genesis-plus-gx/LICENSE.txt
            ${{ env.BG_PROJECT }}/vendor/genesis-plus-gx/PROVENANCE.md
          if-no-files-found: error
          retention-days: 30
